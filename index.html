<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แชร์กิจกรรม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }
    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background-color: #5c5c5c;
      border-radius: 18px;
      padding: 35px 25px 30px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
    .card-text {
      color: #ffffff;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .share-btn {
      width: 100%;
      background-color: #0d6efd;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .share-btn:active {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="card-text">
      กดปุ่มแชร์ด้านล่างลงกลุ่มไลน์ 5 กลุ่มหรือแชร์ให้เพื่อน 10 คนทำกิจกรรมเสร็จแคปหลักฐานการทำกิจกรรมส่งด้วยนะคะ
    </p>
    <button class="share-btn" id="shareBtn" onclick="shareFlex()">แชร์กิจกรรม</button>
  </div>

  <script>
    const flexMessage = {
      "type": "flex",
      "altText": "🔥แจกเครดิตฟรีสมาชิกใหม่ ฝาก 1 รับ 50🔥",
      "contents": {
        "type": "carousel",
        "contents": [
          {
            "type": "bubble",
            "hero": {
              "type": "image",
              "size": "full",
              "aspectRatio": "1:1",
              "aspectMode": "cover",
              "position": "relative",
              "margin": "none",
              "align": "center",
              "gravity": "top",
              "action": {
                "type": "uri",
                "label": "action",
                "uri": "https://rebrand.ly/SIAM85"
              },
              "url": "https://s.imgz.io/2026/10/27/photo_6267211459829897127_y4810828866dced29.jpg"
            },
            "body": {
              "type": "box",
              "layout": "vertical",
              "spacing": "none",
              "contents": [
                {
                  "type": "box",
                  "layout": "baseline",
                  "contents": [
                    {
                      "type": "text",
                      "text": "🔥แจกเครดิตฟรีสมาชิกใหม่🔥",
                      "margin": "sm",
                      "size": "md",
                      "weight": "bold",
                      "style": "normal",
                      "align": "center",
                      "gravity": "center",
                      "color": "#F5F5DC"
                    }
                  ],
                  "spacing": "none",
                  "margin": "xxl",
                  "action": {
                    "type": "uri",
                    "label": "action",
                    "uri": "https://rebrand.ly/SIAM85"
                  }
                },
                {
                  "type": "text",
                  "text": "💸ฝาก 1 รับ 50 💸",
                  "color": "#F5F5DC",
                  "margin": "sm",
                  "size": "xl",
                  "style": "normal",
                  "weight": "bold",
                  "align": "center",
                  "gravity": "center"
                },
                {
                  "type": "text",
                  "text": "กดรับโบนัสหน้าเว็บได้เลย",
                  "color": "#F5F5DC",
                  "margin": "sm",
                  "size": "sm",
                  "style": "normal",
                  "weight": "regular",
                  "align": "center",
                  "gravity": "center"
                },
                {
                  "type": "text",
                  "text": "🔻รับโค้ดฟรีทุกวัน🔻",
                  "color": "#F5F5DC",
                  "margin": "sm",
                  "size": "sm",
                  "style": "normal",
                  "weight": "regular",
                  "align": "center",
                  "gravity": "center"
                },
                {
                  "type": "text",
                  "text": "CODE : FUNKY-50",
                  "color": "#F5F5DC",
                  "margin": "sm",
                  "size": "md",
                  "style": "normal",
                  "weight": "bold",
                  "align": "center",
                  "gravity": "center"
                }
              ],
              "backgroundColor": "#000000",
              "offsetTop": "none",
              "action": {
                "type": "uri",
                "label": "action",
                "uri": "https://rebrand.ly/SIAM85"
              },
              "margin": "none",
              "position": "relative",
              "paddingAll": "none",
              "paddingTop": "none",
              "paddingBottom": "none",
              "paddingStart": "none",
              "paddingEnd": "none",
              "borderWidth": "none"
            },
            "footer": {
              "type": "box",
              "layout": "vertical",
              "spacing": "md",
              "contents": [
                {
                  "type": "button",
                  "style": "primary",
                  "action": {
                    "type": "uri",
                    "label": "👉🏻 สมัครสมาชิก",
                    "uri": "https://rebrand.ly/JUAD88"
                  },
                  "color": "#FF6699"
                },
                {
                  "type": "button",
                  "action": {
                    "type": "uri",
                    "label": "👉🏻 รับโค้ดเพิ่ม !💸",
                    "uri": "https://rebrand.ly/SIAM85"
                  },
                  "color": "#FF6666",
                  "height": "sm",
                  "style": "secondary"
                }
              ],
              "backgroundColor": "#000000",
              "margin": "none",
              "justifyContent": "center",
              "borderWidth": "none",
              "action": {
                "type": "uri",
                "label": "action",
                "uri": "https://rebrand.ly/SIAM85"
              }
            },
            "styles": {
              "footer": {
                "backgroundColor": "#000000"
              }
            }
          }
        ]
      }
    };

    async function initLiff() {
      try {
        await liff.init({ liffId: "2012228732-rY9NxTIH" });
        if (!liff.isLoggedIn()) {
          liff.login();
        }
      } catch (err) {
        console.error('LIFF Init error:', err);
      }
    }

    async function shareFlex() {
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      if (liff.isApiAvailable('shareTargetPicker')) {
        try {
          const res = await liff.shareTargetPicker([flexMessage]);
          if (res) {
            liff.closeWindow();
          }
        } catch (error) {
          console.error("ส่งไม่สำเร็จ:", error);
        }
      } else {
        alert("อุปกรณ์หรือแอปเวอร์ชันนี้ไม่รองรับการแชร์");
      }
    }

    window.onload = initLiff;
  </script>
</body>
</html>
